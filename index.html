<style>:root{--navy:#08222f;--navy2:#0d3042;--navy3:#163f55;--brand:#d0191f;--brand2:#a91217;--bg:#f2f5f8;--card:#fff;--line:#e3e9ef;--txt:#0f2533;--mut:#64748b;--soft:#f6f8fb;--ok:#059669;--warn:#d97706;--bad:#d0191f;--blue:#2563eb;--violet:#7c3aed;--shadow:0 1px 2px rgba(8,34,47,.06),0 6px 24px rgba(8,34,47,.06)}
html.dark{--bg:#06141c;--card:#0b2230;--line:#18394b;--txt:#e6eef3;--mut:#93a7b5;--soft:#0e2a3a;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.sign{font-family:"Great Vibes","Brush Script MT",cursive}
/* layout */
.shell{display:grid;grid-template-columns:256px 1fr;min-height:100vh}
.side{background:var(--navy);color:#cfe0ea;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.side .logo{padding:18px 20px 6px}
.side .logo img{width:150px;display:block}
.side .logo small{display:block;margin-top:8px;font-size:10px;letter-spacing:.22em;font-weight:800;color:#e9545a}
.nav{padding:6px 12px 18px;flex:1}
.nav h6{margin:12px 10px 4px;font-size:10px;letter-spacing:.18em;color:#6f8fa2;font-weight:800;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;text-decoration:none;font-weight:600;font-size:13.5px;color:#b9cfdc;margin:1px 0}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:linear-gradient(90deg,var(--brand),#e0383e);color:#fff;box-shadow:0 6px 18px rgba(208,25,31,.35)}
.nav a .ic{width:18px;text-align:center;opacity:.95}
.nav a .cnt{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:99px}
.side .me{padding:14px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.side .me b{display:block;color:#fff;font-size:13px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top .search{flex:1;min-width:220px;max-width:420px;position:relative}
.top .search input{padding-left:34px}
.top .search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.content{padding:22px 24px 40px;flex:1}
.foot{padding:14px 24px 18px;display:flex;justify-content:space-between;align-items:flex-end;color:var(--mut);font-size:11px}
.sigblock{text-align:right}
.sigblock .sign{font-size:22px;color:var(--navy3);transform:rotate(-3deg);display:inline-block;line-height:1}
html.dark .sigblock .sign{color:#cbd5e1}
.sigblock div:last-child{border-top:1px solid var(--line);margin-top:3px;padding-top:2px;font-size:8.5px;letter-spacing:.15em;text-transform:uppercase}
/* elementos */
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.ph h1 .ic{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--navy);color:#fff;font-size:17px}
.ph p{margin:4px 0 0;color:var(--mut);max-width:780px}
.tl-card{padding:14px 18px 12px}.tl-hd{display:flex;justify-content:space-between;align-items:center;gap:10px}.tl-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.tl-t b{font-size:14px;font-weight:800}.tl-t .sub{font-size:12px}
.tl-tog{display:inline-flex;background:var(--bg,#f1f5f9);border:1px solid var(--line);border-radius:9px;padding:2px;flex:none}.tl-tog button{border:0;background:none;padding:3px 10px;border-radius:7px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer}.tl-tog button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tl-chips{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 4px;font-size:12px;color:var(--mut)}.tl-chip{display:inline-flex;align-items:center;gap:6px}.tl-chip i{width:9px;height:9px;border-radius:50%;display:inline-block}.tl-chip b{color:var(--txt);font-weight:700}
.tl-grid{display:grid;gap:18px}.tl-st{font-size:12px;font-weight:600;color:var(--mut);margin:10px 0 2px;display:flex;align-items:center;gap:6px}.tl-st b{color:var(--txt)}.tl-st i{width:8px;height:8px;border-radius:50%;display:inline-block}.tl-svg{display:block;overflow:visible}.tl-svg .tl-ax{font-size:10.5px;fill:var(--mut)}.tl-svg .tl-hit:hover{fill:rgba(100,116,139,.07)}
@media print{.tl-tog{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card .hd{padding:16px 18px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .hd h3{margin:0;font-size:15px;font-weight:800}
.card .hd p{margin:2px 0 0;color:var(--mut);font-size:12.5px}
.card .bd{padding:16px 18px}
.card .bd.np{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g12{grid-template-columns:1.25fr 1fr}
.mb{margin-bottom:14px}.mt{margin-top:14px}
@media(max-width:1300px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:1000px){.shell{grid-template-columns:1fr}.side{position:relative;height:auto}.g2,.g3,.g4,.g12{grid-template-columns:1fr}.g5,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{transform:translateY(-1px);border-color:#b8c7d3}
.kpi .l{font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.1}
.kpi .v.sm{font-size:20px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:3px}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tone,#94a3b8)}
.t-red{--tone:var(--bad)}.t-green{--tone:var(--ok)}.t-amber{--tone:var(--warn)}.t-blue{--tone:var(--blue)}.t-navy{--tone:var(--navy3)}.t-violet{--tone:var(--violet)}
.hero{background:linear-gradient(120deg,var(--navy) 0%,var(--navy3) 100%);color:#fff;border-radius:22px;padding:22px 24px;position:relative;overflow:hidden;box-shadow:0 14px 40px rgba(8,34,47,.25)}
.hero:after{content:"";position:absolute;right:-120px;top:-120px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(208,25,31,.45),transparent 65%)}
.hero .row{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;position:relative;z-index:1}
@media(max-width:1100px){.hero .row{grid-template-columns:repeat(3,1fr)}}
.hero .it .l{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#a9c3d2;font-weight:700}
.hero .it .v{font-size:30px;font-weight:800;letter-spacing:-.02em}
.hero .it .s{font-size:12px;color:#c9d9e3}
.hero .ttl{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.hero .ttl b{font-size:13px;letter-spacing:.18em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:rgba(255,255,255,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:#a9bac8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy3)}
.btn.red{background:var(--brand);border-color:var(--brand);color:#fff}.btn.red:hover{background:var(--brand2)}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:9px}
.inp,select.inp,textarea.inp{width:100%;padding:9px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);outline:none;min-width:0}
.inp:focus{border-color:#7aa6c2;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.lbl{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin:0 0 5px;text-transform:uppercase;letter-spacing:.05em}
.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.fl>div{min-width:150px;flex:1}
.fl>div.w2{flex:2}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.b-red{background:#fde8e8;color:#a3141a}.b-amber{background:#fef3c7;color:#92400e}.b-green{background:#d1fae5;color:#065f46}.b-blue{background:#dbeafe;color:#1e40af}.b-gray{background:#e9eef3;color:#475569}.b-violet{background:#ede9fe;color:#5b21b6}.b-navy{background:var(--navy);color:#fff}
html.dark .b-red{background:#4a1416;color:#fda4a7}html.dark .b-amber{background:#45300c;color:#fcd34d}html.dark .b-green{background:#0c3b2c;color:#6ee7b7}html.dark .b-blue{background:#152e5c;color:#93c5fd}html.dark .b-gray{background:#1d3a4b;color:#c2d3de}html.dark .b-violet{background:#2e1f5c;color:#c4b5fd}
table.t{width:100%;border-collapse:collapse}
table.t th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
table.t tr:hover td{background:color-mix(in srgb,var(--soft) 70%,transparent)}
table.t tr.grp td{border-top:2px solid #cbd5e1}
.tw{overflow:auto;max-height:66vh}
.sub{font-size:11.5px;color:var(--mut)}
.lnk{background:none;border:0;padding:0;cursor:pointer;font-weight:700;text-align:left}.lnk:hover{text-decoration:underline;color:var(--brand)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12.5px;color:var(--mut);gap:8px;flex-wrap:wrap}
.tabs{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--txt);font-size:15px;margin-bottom:4px}
.note{border-radius:14px;padding:12px 16px;font-size:13px;border:1px solid}
.n-blue{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}.n-amber{background:#fffbeb;border-color:#fde68a;color:#78350f}.n-red{background:#fef2f2;border-color:#fecaca;color:#7f1d1d}.n-violet{background:#f5f3ff;border-color:#ddd6fe;color:#4c1d95}.n-green{background:#ecfdf5;border-color:#a7f3d0;color:#064e3b}
html.dark .note{background:var(--soft);border-color:var(--line);color:var(--txt)}
/* gaveta e modal */
.ov{position:fixed;inset:0;background:rgba(4,16,24,.55);z-index:60;display:flex;justify-content:flex-end;animation:fd .15s}
.ov.center{justify-content:center;align-items:center;padding:20px}
.drawer{width:min(760px,100%);height:100%;background:var(--bg);overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.25);animation:sl .2s}
.drawer .dh{position:sticky;top:0;background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;gap:10px;z-index:2}
.drawer .dh h2{margin:0;font-size:17px}
.drawer .db{padding:18px 20px}
.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .15s}
.modal .mh{padding:18px 20px 8px;display:flex;justify-content:space-between;align-items:center}
.modal .mh h2{margin:0;font-size:17px}
.modal .mb2{padding:8px 20px 14px}
.modal .mf{padding:12px 20px 18px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line)}
@keyframes fd{from{opacity:0}}@keyframes sl{from{transform:translateX(40px);opacity:.4}}@keyframes pop{from{transform:scale(.97);opacity:.4}}
.kv{display:grid;grid-template-columns:180px 1fr;gap:0;font-size:13px}
.kv>div{padding:7px 0;border-bottom:1px dashed var(--line)}
.kv>div:nth-child(odd){color:var(--mut);font-weight:600}
.toast{position:fixed;right:20px;bottom:20px;z-index:99;pointer-events:none;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:600;max-width:420px;animation:pop .2s}
.toast div.err{background:var(--brand)}
.prog{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#f05a5f);transition:width .2s}
.drop{border:2px dashed #9fb4c3;border-radius:20px;padding:34px;text-align:center;background:var(--soft);transition:.15s}
.drop.on{border-color:var(--brand);background:#fff5f5}
.drop .big{font-size:40px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--mut);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.alert-row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.alert-row:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.chk{width:16px;height:16px;accent-color:var(--brand)}
.switch{position:relative;width:38px;height:22px;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:.15s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.switch input:checked+span{background:var(--ok)}
.switch input:checked+span:before{transform:translateX(16px)}
.gauge{position:relative;width:150px;height:150px;margin:auto}
.gauge .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.gauge .c b{font-size:30px;font-weight:800;display:block}
.cmt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--card)}
/* login */
.lx{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(420px,1fr);min-height:100vh;background:var(--bg)}
.lx-hero{position:relative;overflow:hidden;color:#fff;background:#061a24;display:flex;flex-direction:column;padding:clamp(24px,4vh,44px) clamp(28px,4.5vw,64px)}
.lx-mesh{position:absolute;inset:-20%;background:radial-gradient(40% 45% at 85% 85%,rgba(208,25,31,.55),transparent 70%),radial-gradient(45% 50% at 10% 5%,rgba(30,111,140,.55),transparent 70%),radial-gradient(35% 35% at 60% 35%,rgba(22,63,85,.9),transparent 70%);filter:blur(10px);animation:lxDrift 18s ease-in-out infinite alternate}
.lx-grid{position:absolute;inset:0;opacity:.09;background-image:linear-gradient(rgba(255,255,255,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.6) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 40% 50%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 40% 50%,#000 25%,transparent 75%)}
@keyframes lxDrift{to{transform:translate3d(-3%,2%,0) scale(1.05)}}
.lx-top,.lx-mid,.lx-pillars{position:relative;z-index:1}
.lx-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.lx-logo{height:46px;width:auto;display:block;mix-blend-mode:lighten}
.lx-ver{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8fb0c2;font-weight:700;border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.04)}
.lx-mid{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:620px;padding:22px 0}
.lx-eyebrow{display:inline-flex;align-items:center;gap:9px;align-self:flex-start;font-size:11.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:#ffd6d7;background:rgba(208,25,31,.18);border:1px solid rgba(255,120,124,.35);padding:7px 14px;border-radius:99px}
.lx-eyebrow i{width:7px;height:7px;border-radius:50%;background:#ff5a5f;box-shadow:0 0 0 0 rgba(255,90,95,.7);animation:lxPulse 2s infinite}
@keyframes lxPulse{70%{box-shadow:0 0 0 9px rgba(255,90,95,0)}100%{box-shadow:0 0 0 0 rgba(255,90,95,0)}}
.lx-hero h1{font-size:clamp(36px,4.4vw,58px);line-height:1.02;letter-spacing:-.035em;margin:18px 0 12px;font-weight:800}
.lx-hero h1 em{font-style:normal;background:linear-gradient(90deg,#ff6b70,#ffb3b5);-webkit-background-clip:text;background-clip:text;color:transparent}
.lx-mid>p{color:#b4c8d4;font-size:15.5px;line-height:1.6;max-width:500px;margin:0}
.lx-stage{position:relative;margin-top:clamp(52px,7vh,70px);max-width:560px;padding:0 34px 30px 0}
.lx-panel{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);padding:16px 18px 14px;animation:lxFloat 7s ease-in-out infinite}
@keyframes lxFloat{50%{transform:translateY(-6px)}}
.lx-ph{display:flex;align-items:center;gap:10px;font-size:12.5px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.08)}
.lx-ph b{font-weight:700;color:#e6eef3}.lx-live{margin-left:auto;font-size:11px;color:#34d399;font-weight:700}
.lx-dots{display:flex;gap:5px}.lx-dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22)}.lx-dots i:first-child{background:#ff5f57}
.lx-pb{display:flex;gap:20px;align-items:center;padding:16px 0 12px}
.lx-ring{position:relative;width:104px;height:104px;flex:none}
.lx-ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.lx-ring circle{fill:none;stroke-width:8}.lx-ring .bg{stroke:rgba(255,255,255,.1)}
.lx-ring .fg{stroke:#34d399;stroke-linecap:round;animation:lxRing 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes lxRing{from{stroke-dasharray:0 var(--len)}}
.lx-ring>div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.lx-ring b{font-size:19px;font-weight:800;letter-spacing:-.02em}.lx-ring span{font-size:8.5px;color:#9db6c4;text-transform:uppercase;letter-spacing:.08em}
.lx-rows{flex:1;display:grid;gap:11px}
.lx-row>div:first-child{display:flex;justify-content:space-between;font-size:12px;color:#c6d6df;margin-bottom:5px}.lx-row b{color:#fff}
.lx-track{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}

/* ================= motor de validações ================= */

  if (ruleOn("SITUACAO_INVALIDA")) {
    const ok = new Set([...S.situacao.ativo, ...S.situacao.cancelado].map(normName));
    const bad = Uint8Array.from(ds.dict.situacao.v, (v) => { const n = normName(v); return !n || !ok.has(n.split(" ")[0]) ? 1 : 0; });
    const si = ds.dict.situacao.i; for (let r = 0; r < N; r++) if (!inc[r] && bad[si[r]]) add(r, "SITUACAO_INVALIDA");
  }

  await step("Datas de nascimento");

  const bv = ds.dict.birth.v, bd = ds.days.birth, bi = ds.dict.birth.i;
  const dnRule = bv.map((v, k) => { const p = dateProblem(v); if (p) return { vazia: "DN_VAZIA", espacos: "DN_ESPACOS", texto: "DN_TEXTO", formato: "DN_FORMATO", impossivel: "DN_IMPOSSIVEL" }[p]; if (bd[k] > T) return "DN_FUTURA"; if (generic.has(v.trim())) return "DN_GENERICA"; return null; });
  if (ds.present.includes("birth")) for (let r = 0; r < N; r++) { if (inc[r]) continue; const ru = dnRule[bi[r]]; if (ru && ruleOn(ru)) add(r, ru); }

  if (ruleOn("IDADE_INCOMPATIVEL")) {
    const p = S.rules.IDADE_INCOMPATIVEL.params || {}; const maxA = +(p.maxAge ?? 110), minT = +(p.minTitularAge ?? 16), minC = +(p.minConjugeAge ?? 16);

    }
  }

  await step("Género");
  const allowed = new Set([...(S.rules.GEN_INVALIDO?.params?.allowed || []), "MASCULINO", "FEMININO", "M", "F", "MASC", "FEM"].map(normName));
  const gRule = ds.dict.gender.v.map((v) => { if (!v || !v.trim()) return "GEN_VAZIO"; if (!allowed.has(normName(v))) return "GEN_INVALIDO"; if (v !== v.trim() || /\s{2,}/.test(v)) return "GEN_ESPACOS"; return null; });

  await step("Ativação");

/* ================= comparação entre semanas ================= */
const DIFF_FIELDS = [

  ["Género", "gender", (d, r) => S_(d, "gender", r).trim()], ["Situação", "situacao", (d, r) => S_(d, "situacao", r)], ["Data de ativação", "activation", (d, r) => S_(d, "activation", r).trim()], ["Data de inclusão", "inclusion", (d, r) => fd(D_(d, "inclusion", r))],
  ["Apólice", "policy", (d, r) => S_(d, "policy", r)], ["Empresa", "company", (d, r) => S_(d, "company", r)], ["Cartão titular", "titular_card", (d, r) => titOf(d, r)],
  ["BI", "bi", (d, r) => d.raw.bi[r]], ["Início cobertura", "coverage_start", (d, r) => fd(D_(d, "coverage_start", r))], ["Fim cobertura", "coverage_end", (d, r) => fd(D_(d, "coverage_end", r))],
  ["Carência", "grace", (d, r) => S_(d, "grace", r)], ["Data cancelamento", "cancel_date", (d, r) => fd(D_(d, "cancel_date", r))], ["Motivo", "motivo", (d, r) => S_(d, "motivo", r)],

    for (const [label, f, get] of fields) {

}

function anaDay() { const C = App.cur; if (isMonth()) return mondayOf(monthRange(App.f.month)[0]); if (!isAll()) return +App.f.week; return C ? mondayOf(C.load.weekDay) : mondayOf(todayDay()); }

function weekMask(ds) { const C = App.cur; if (isAll()) return null; C._wm = C._wm || {}; const key = App._rng ? "r" + App._rng.join("_") : isMonth() ? "m" + App.f.month : App.f.week; if (C._wm[key]) return C._wm[key];

  return (C._wm[key] = m); }
function dataWeeks(ds) {
  const T = todayDay(), min = T - 730, m = new Map(); const F = ["inclusion", "change_date", "activation", "cancel_date"].map((f) => [ds.days[f], ds.dict[f].i]);
  for (let r = 0; r < ds.n; r++) { let w1 = null, w2 = null, w3 = null;

function currentTabDetailData() {
  const C = App.cur;
  if (!C) return { header: ["Informação"], rows: [["Não existem dados carregados nesta aba."]] };
  const ds = C.ds, allow = makeAllow(), fields = ALL_FIELDS.filter((f) => ds.present.includes(f));
  const sev = C.sev || rowSeverity(ds, C.iss);
  const errs = new Map();
  for (let k = 0; k < C.iss.count; k++) {
    const r = C.iss.row[k];
    if (allow && !allow(r)) continue;
    const list = errs.get(r) || [];
    list.push(ruleLabel(RULES[C.iss.rule[k]]));

  }
  const header = [...fields.map((f) => FIELD_LABEL[f] || f), "Conformidade", "Problemas encontrados", "Colaborador responsável", "Ficheiro", "Linha"];

/** tabela paginada: cols [{h, f:(item)=>html, cls}] */
function pagedTable(el, items, cols, opts = {}) {
  const size = opts.size || 50; let page = 0;
  const draw = () => {
    const pages = Math.max(1, Math.ceil(items.length / size)); if (page >= pages) page = pages - 1;
    const slice = items.slice(page * size, page * size + size);
    el.innerHTML = !items.length ? emptyBox(opts.empty || "Nenhum resultado", opts.emptySub || "") :
      `<div class="tw"><table class="t"><thead><tr>${cols.map((c) => `<th class="${c.cls || ""}">${c.h}</th>`).join("")}</tr></thead><tbody>${slice.map((it, i) => `<tr class="${opts.rowCls ? opts.rowCls(it, slice[i - 1]) : ""}">${cols.map((c) => `<td class="${c.cls || ""}">${c.f(it)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
      <div class="pager"><span>${nf(page * size + 1)}–${nf(Math.min(items.length, page * size + size))} de <b>${nf(items.length)}</b></span><span class="flex"><button class="btn sm" data-p="-1" ${page ? "" : "disabled"}>‹ Anterior</button><span>Página ${nf(page + 1)} de ${nf(pages)}</span><button class="btn sm" data-p="1" ${page < pages - 1 ? "" : "disabled"}>Seguinte ›</button></span></div>`;
    $$("[data-p]", el).forEach((b) => (b.onclick = () => { page += +b.dataset.p; draw(); el.scrollIntoView({ block: "nearest" }); }));
    opts.bind && opts.bind(el, slice);
  };
  draw(); return { redraw: draw };
}

const PAL = ["#d0191f", "#163f55", "#2563eb", "#059669", "#d97706", "#7c3aed", "#0891b2", "#db2777", "#65a30d", "#475569"];
function lineChart(labels, series, opts = {}) {
  if (!labels.length) return emptyBox("Ainda sem histórico", "Carregue mais semanas para ver a evolução.");
  const W = 640, H = opts.h || 230, L = 44, R = opts.right ? 44 : 14, T = 14, B = 34; const iw = W - L - R, ih = H - T - B;
  const axisMax = (ss) => { const m = Math.max(1, ...ss.flatMap((s) => s.values.filter((v) => v != null))); const p = Math.pow(10, Math.floor(Math.log10(m))); return Math.ceil(m / p) * p; };
  const left = series.filter((s) => !s.right), right = series.filter((s) => s.right);
  const mL = opts.max || axisMax(left), mR = right.length ? axisMax(right) : 1;
  const x = (i) => L + ((i + 0.5) * iw) / labels.length;
  const y = (v, r) => T + ih - (v / (r ? mR : mL)) * ih;
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = (mL * k) / 4, yy = y(v); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${opts.pct ? Math.round(v) + "%" : nf(Math.round(v))}</text>`; if (right.length) g += `<text x="${W - R + 6}" y="${yy + 4}">${nf(Math.round((mR * k) / 4))}</text>`; }
  const step = Math.ceil(labels.length / 10);
  labels.forEach((l, i) => { if (i % step === 0 || (i === labels.length - 1 && i % step >= step / 2)) g += `<text x="${x(i)}" y="${H - 12}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach((s, si) => {
    const c = s.color || PAL[si]; const pts = s.values.map((v, i) => (v == null ? null : [x(i), y(v, s.right)])).filter(Boolean);
    if (s.bars) { const bw = Math.max(4, Math.min(28, iw / labels.length - 8)); s.values.forEach((v, i) => { if (v == null) return; g += `<rect x="${x(i) - bw / 2}" y="${y(v, s.right)}" width="${bw}" height="${T + ih - y(v, s.right)}" rx="4" fill="${c}" opacity=".85"><title>${esc(labels[i])}: ${nf(v)}</title></rect>`; }); return; }
    if (pts.length > 1) g += `<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${pts.map((p) => p.join(",")).join(" ")}"/>`;
    s.values.forEach((v, i) => { if (v != null) g += `<circle cx="${x(i)}" cy="${y(v, s.right)}" r="4" fill="${c}" stroke="#fff" stroke-width="1.5"><title>${esc(s.name)} — ${esc(labels[i])}: ${opts.pct && !s.right ? pf(v) : nf(v)}</title></circle>`; });
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${g}</svg><div class="legend">${series.map((s, i) => `<span><i style="background:${s.color || PAL[i]}"></i>${esc(s.name)}</span>`).join("")}</div></div>`;
}
function donut(segs, center = "") {
  const tot = segs.reduce((a, s) => a + s.value, 0); if (!tot) return emptyBox("Sem dados");
  let a0 = -Math.PI / 2, g = ""; const R = 70, r = 46, cx = 90, cy = 90;
  for (const [i, s] of segs.entries()) {
    if (!s.value) continue; const a1 = a0 + (s.value / tot) * Math.PI * 2 - 0.0001; const big = a1 - a0 > Math.PI ? 1 : 0;
    const p = (rr, a) => `${cx + rr * Math.cos(a)},${cy + rr * Math.sin(a)}`;
    g += `<path d="M${p(R, a0)} A${R},${R} 0 ${big} 1 ${p(R, a1)} L${p(r, a1)} A${r},${r} 0 ${big} 0 ${p(r, a0)}Z" fill="${s.color || PAL[i]}"><title>${esc(s.label)}: ${nf(s.value)} (${pf((s.value / tot) * 100)})</title></path>`; a0 = a1 + 0.0001;
  }
  return `<div class="flex" style="gap:18px;flex-wrap:nowrap"><svg viewBox="0 0 180 180" style="width:170px;flex:none">${g}<text x="90" y="88" text-anchor="middle" style="font-size:20px;font-weight:800;fill:var(--txt)">${center || nf(tot)}</text><text x="90" y="106" text-anchor="middle" style="font-size:10px;fill:var(--mut)">total</text></svg>
    <div style="flex:1">${segs.map((s, i) => `<div class="flex between" style="padding:5px 0;border-bottom:1px dashed var(--line);font-size:13px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${s.color || PAL[i]};margin-right:7px"></i>${esc(s.label)}</span><b>${nf(s.value)} <span class="sub">${pf((s.value / tot) * 100)}</span></b></div>`).join("")}</div></div>`;
}
function gauge(v, goal) {
  const c = v >= goal ? "var(--ok)" : v >= goal - 10 ? "var(--warn)" : "var(--bad)"; const a = Math.max(0, Math.min(100, v)) / 100;
  const R = 62, L = 2 * Math.PI * R;
  return `<div class="gauge"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--soft)" stroke-width="14"/><circle cx="75" cy="75" r="${R}" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${L * a} ${L}" transform="rotate(-90 75 75)"/></svg><div class="c"><div><b>${pf(v)}</b><span class="sub">meta ${goal}%</span></div></div></div>`;

/* ======= filtros automáticos de empresa / apólice (preenchidos com o que existe nos dados mostrados) ======= */
function entitySelectsHtml(ds, rows, comIx, polIx, label = "") {
  const cc = new Map(), pc = new Map();
  for (const r of rows) { const c = ds.dict.company.i[r]; cc.set(c, (cc.get(c) || 0) + 1); }
  for (const r of rows) { if (comIx >= 0 && ds.dict.company.i[r] !== comIx) continue; const pI = ds.dict.policy.i[r]; const o = pc.get(pI) || { n: 0, c: ds.dict.company.i[r] }; o.n++; pc.set(pI, o); }
  const com = `<option value="-1">Todas as empresas (${nf(cc.size)})</option>` + [...cc].sort((x, y) => y[1] - x[1]).map(([k, n]) => `<option value="${k}" ${k === comIx ? "selected" : ""}>${esc(ds.dict.company.v[k] || "(sem empresa)")} — ${nf(n)}${label}</option>`).join("");
  const pol = `<option value="-1">Todas as apólices (${nf(pc.size)})</option>` + [...pc].sort((x, y) => y[1].n - x[1].n).map(([k, o]) => `<option value="${k}" ${k === polIx ? "selected" : ""}>${esc(ds.dict.policy.v[k] || "(sem apólice)")} — ${esc(ds.dict.company.v[o.c] || "")} (${nf(o.n)})</option>`).join("");
  return { com, pol };
}

/* ================= processamento de uma pasta semanal ================= */

    if (info.status === "ok" && info.rows && S.storage.keepOriginals && !file.__key && file.size > (S.storage.maxOriginalMB || 250) * 1048576) info.note = "Cópia do original não guardada (ficheiro maior que " + (S.storage.maxOriginalMB || 250) + " MB) — guarde a pasta original no seu computador.";

  }

  const prevL = App.loads.filter((l) => l.status === "processado" && l.id !== id && l.weekDay < weekDay).pop();
  const prev = prevL ? await loadDS(prevL.id) : null;
  ui.phase("Validações de conformidade", 1);
  const iss = await validate(ds, prev, id, (s) => ui.phase("Validação: " + s, 1));

      <div id="run" class="mt"><div class="flex between"><b id="ph">A iniciar…</b><span class="sub" id="pc"></span></div><div class="prog mt"><i id="pb" style="width:0"></i></div><div class="sub mt" id="pfn"></div></div>`
      : `<div class="note n-amber mt"><b>Nenhum ficheiro CSV ou Excel (.xlsx) encontrado nesta pasta.</b> Confirme que escolheu a pasta certa. Ficheiros .xls antigos devem ser guardados como .xlsx ou .csv.</div>`}</div>`;
    if (!ok.length) return;
    $("#wkinfo", el).innerHTML = `📅 Semana de referência: <b>${esc(weekLabel(wd))}</b> (${fd(mondayOf(wd))} a ${fd(mondayOf(wd) + 6)}) — ${guessed != null ? "detetada pelo nome da pasta/ficheiro" : "data de hoje"}`;
    // UM CLIQUE: ao escolher a pasta/ficheiros o processamento começa automaticamente.
    if (auto && !App.busy) setTimeout(() => run(ok, wd), 0);
  };
  const run = async (files, wd) => {
    const same = App.loads.find((l) => l.status === "processado" && isoWeek(l.weekDay).week === isoWeek(wd).week && isoWeek(l.weekDay).year === isoWeek(wd).year);
    let replaceId = null;
    if (same) { replaceId = same.id; toast(`${same.label} já estava carregada — foi substituída pela nova versão. A comparação com a semana anterior é refeita.`); }
    App.busy = true; const t0 = Date.now(); window.onbeforeunload = () => "O processamento ainda está a decorrer.";
    const ui = { phase: (t, p) => { const x = $("#ph", el); if (x) x.textContent = t; if (p != null && $("#pb", el)) $("#pb", el).style.width = Math.round(p * 100) + "%"; },
      progress: (p, rows) => { if (!$("#pb", el)) return; $("#pb", el).style.width = Math.round(p * 100) + "%"; $("#pc", el).textContent = `${Math.round(p * 100)}% · ${nf(rows)} registos lidos · ${((Date.now() - t0) / 1000).toFixed(0)} s`; },
      file: (n) => { const x = $("#pfn", el); if (x) x.textContent = "A ler: " + n; } };
    try {
      if (replaceId) { const old = App.loads.find((l) => l.id === replaceId); old.files = []; }
      const load = await processLoad({ files, weekDay: wd, label: weekLabel(wd), id: replaceId || undefined }, ui);
      staged = []; window.onbeforeunload = null; App.busy = false;
      if (load.status === "com_erros") { toast(load.error, true); draw(); drawTop(); details(App.loads.find((l) => l.id === load.id)); return; }
      toast(`Pasta processada: ${nf(load.n)} registos em ${(load.durationMs / 1000).toFixed(1)} s. Use os filtros nas páginas de análise.`);
      draw(); drawTop(); details(App.loads.find((l) => l.id === load.id));
    } catch (e) { console.error(e); window.onbeforeunload = null; App.busy = false; toast("Erro ao processar: " + (e.message || e), true); staged = []; draw(); }
  };
  const details = (l) => {
    if (!l) return;
    modal("Detalhes — " + esc(l.label), `<div class="grid g3 mb">${kpi("Registos", nf(l.n), "", "navy")}${kpi("Ficheiros", nf((l.files || []).length), "", "blue")}${kpi("Conformidade", l.stats ? pf(l.stats.conformidade) : "—", "", "green")}</div>
      ${l.error ? `<div class="note n-red mb">${esc(l.error)}</div>` : ""}
      <table class="t"><thead><tr><th>Ficheiro</th><th>Estado</th><th class="right">Registos</th><th class="right">Linhas vazias</th></tr></thead><tbody>${(l.files || []).map((f) => `<tr><td><b>${esc(f.path || f.name)}</b><div class="sub">${fmtBytes(f.size || 0)}${f.encoding ? ` · ${f.encoding} · separador “${f.delimiter === "\t" ? "TAB" : f.delimiter}”` : ""}${f.mapped ? ` · ${Object.keys(f.mapped).length} colunas reconhecidas` : ""}</div>${f.msg ? `<div class="sub down">${esc(f.msg)}</div>` : ""}${f.note ? `<div class="sub">ℹ️ ${esc(f.note)}</div>` : ""}</td><td>${f.status === "ok" ? badge("OK", "green") : f.status === "duplicado" ? badge("Duplicado", "amber") : badge(f.status === "estrutura_invalida" ? "Estrutura inválida" : f.status, "red")}</td><td class="right">${nf(f.rows || 0)}</td><td class="right">${nf(f.empty || 0)}</td></tr>`).join("")}</tbody></table>
      ${(() => { const m = [...new Set((l.files || []).filter((f) => f.status === "ok").flatMap((f) => f.missing || []))]; return m.length ? `<div class="note n-amber mt"><b>Colunas não encontradas no ficheiro:</b> ${m.map((x) => esc(FIELD_LABEL[x])).join(", ")}. As validações dessas colunas não foram feitas. Se existem com outro nome, acrescente o nome em <i>Configurações → Colunas do CSV</i> e clique em Reprocessar.</div>` : ""; })()}
      ${l.files?.find((f) => f.mapped) ? `<details class="mt"><summary class="b" style="cursor:pointer">Colunas reconhecidas</summary><div class="kv mt">${Object.entries(l.files.find((f) => f.mapped).mapped).map(([k, v]) => `<div>${esc(FIELD_LABEL[k] || k)}</div><div>${esc(v)}</div>`).join("")}</div></details>` : ""}`, [{ label: "Fechar", cls: "pri" }], { w: 820 });
  };
  const reprocess = async (l) => {
    const keys = (l.files || []).filter((f) => f.key).map((f) => f.key);
    if (!keys.length) return toast("Os ficheiros originais desta semana não foram guardados — carregue a pasta outra vez.", true);
    if (!(await confirmBox("Reprocessar", `Voltar a ler e validar <b>${esc(l.label)}</b> com as regras e colunas atuais? Os estados e comentários das ocorrências mantêm-se.`, "Reprocessar"))) return;
    const files = []; for (const k of keys) { const r = await DB.get("files", k); if (r?.blob) { const f = r.blob instanceof File ? r.blob : new File([r.blob], r.name); try { Object.defineProperty(f, "__key", { value: k }); } catch {} files.push(f); } }
    if (!files.length) return toast("Ficheiros originais não encontrados.", true);
    showBusy("A reprocessar " + l.label + "…");
    try { const prevDup = l.files; l.files = []; const ld = await processLoad({ files, weekDay: l.weekDay, label: l.label, id: l.id }, { phase: (t) => { const m = $("#busyMsg"); if (m) m.textContent = t; }, progress: (p, n) => { const m = $("#busyMsg"); if (m) m.textContent = `${Math.round(p * 100)}% · ${nf(n)} registos`; }, file: () => {} }); toast(`Reprocessado: ${nf(ld.n)} registos.`); }
    catch (e) { toast(e.message, true); } finally { hideBusy(); draw(); drawTop(); }
  };
  const del = (l) => {
    modal("Eliminar " + esc(l.label), `<div class="note n-red mb">Os dados processados desta semana (registos, ocorrências e movimentos) deixam de aparecer nos painéis. Os comentários e estados das ocorrências mantêm-se.</div>
      <label class="flex mb"><input type="checkbox" class="chk" id="dorig"> Apagar também os ficheiros CSV originais guardados</label>
      <label class="lbl">Para confirmar escreva ELIMINAR</label><input class="inp" id="dc">`, [{ label: "Cancelar" }, { label: "Eliminar", cls: "red", fn: async (ov) => {
        if ($("#dc", ov).value.trim().toUpperCase() !== "ELIMINAR") throw new Error("Escreva ELIMINAR para confirmar.");

          await dropLoadData(l.id); await DB.del("loads", l.id); if ($("#dorig", ov).checked) await DB.delPrefix("files", `${l.id}:`);
          if (App.cur?.load.id === l.id) App.cur = null; if (App.f.loadId === l.id) App.f.loadId = null;
          await loadMeta(); const next = App.loads.find((x) => x.prevId === l.id); if (next) await recomputeLoad(next.id);
          await audit("Eliminou pasta", l.label); await loadMeta();
          if (!App.f.loadId) { const d = App.loads.filter((x) => x.status === "processado"); App.f.loadId = d.length ? d[d.length - 1].id : null; }
        } finally { hideBusy(); }
        toast("Pasta eliminada."); draw(); drawTop();
      } }]);
  };
  draw();
};

function b64ofTA(ta) { const u = new Uint8Array(ta.buffer, ta.byteOffset, ta.byteLength); let s = ""; for (let i = 0; i < u.length; i += 32766) s += btoa(String.fromCharCode.apply(null, u.subarray(i, i + 32766))); return s; }
function taOfB64(t, b) { const bin = atob(b); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new globalThis[t](u.buffer); }
const TA = ["Int32Array", "Uint8Array", "Uint16Array", "Float64Array"];
const enc = (v) => { if (v && TA.includes(v.constructor?.name)) return { __ta: v.constructor.name, b: b64ofTA(v) }; if (Array.isArray(v)) return v; if (v && typeof v === "object" && !(v instanceof Blob)) { const o = {}; for (const k in v) o[k] = enc(v[k]); return o; } return v; };
const dec = (v) => { if (v && typeof v === "object") { if (v.__ta) return taOfB64(v.__ta, v.b); if (Array.isArray(v)) return v; for (const k in v) v[k] = dec(v[k]); } return v; };
PAGES.backup = async (el) => {
  el.innerHTML = ph("💾", "Cópia de segurança", "Os dados vivem neste computador. Faça uma cópia regularmente (ex.: todas as semanas) e guarde-a num local seguro — serve também para passar o sistema para outro computador.") +
    `<div class="grid g2">${card("Criar cópia", "Ficheiro .smdq com utilizadores, equipas, configurações, semanas, ocorrências, comentários e plano de ação.", `<label class="flex mb"><input type="checkbox" class="chk" id="bo"> Incluir os ficheiros CSV originais e anexos (cópia maior)</label><button class="btn pri" id="bx">⬇ Criar e descarregar cópia</button>`)}
    ${card("Restaurar cópia", "Substitui TODOS os dados deste computador pelos da cópia.", `<input type="file" class="inp mb" id="bf" accept=".smdq,.gz,.json"><button class="btn red" id="bi">⬆ Restaurar</button>`)}</div>
    ${card("Zona perigosa", "", `<button class="btn" id="bz" style="color:var(--bad)">Apagar todos os dados deste computador</button>`, { cls: "mt" })}`;
  $("#bx", el).onclick = async () => {
    showBusy("A criar a cópia de segurança…"); const parts = []; const withFiles = $("#bo", el).checked;
    try {
      for (const st of STORES) {
        if ((st === "files" || st === "att") && !withFiles) continue;
        const keys = await DB.keys(st);
        for (const k of keys) { let v = await DB.get(st, k); if (v && (st === "files" || st === "att") && v.blob) { const buf = new Uint8Array(await v.blob.arrayBuffer()); v = { ...v, blob: undefined, data: { __ta: "Uint8Array", b: b64ofTA(buf) }, type: v.blob.type }; } parts.push(JSON.stringify([st, k, enc(v)]) + "\n"); $("#busyMsg").textContent = `${st}: ${k}`; await tick(); }
      }
      let blob = new Blob(parts, { type: "application/json" });
      if (window.CompressionStream) blob = await new Response(blob.stream().pipeThrough(new CompressionStream("gzip"))).blob();
      saveBlob(blob, `saudemais_dq_backup_${stamp()}.smdq`); await audit("Criou cópia de segurança", fmtBytes(blob.size)); toast(`Cópia criada (${fmtBytes(blob.size)}).`);
    } catch (e) { toast(e.message, true); } finally { hideBusy(); }
  };
  $("#bi", el).onclick = async () => {
    const f = $("#bf", el).files[0]; if (!f) return toast("Escolha o ficheiro da cópia.", true);
    if (!(await confirmBox("Restaurar cópia", "Todos os dados atuais deste computador vão ser substituídos pelos da cópia. Continuar?", "Restaurar", true))) return;
    showBusy("A restaurar…");
    try {
      const head = new Uint8Array(await f.slice(0, 2).arrayBuffer()); let stream = f.stream();
      if (head[0] === 0x1f && head[1] === 0x8b) stream = stream.pipeThrough(new DecompressionStream("gzip"));
      const reader = stream.pipeThrough(new TextDecoderStream()).getReader(); let buf = "", n = 0;
      for (const st of STORES) await DB.clear(st);
      const putLine = async (line) => { if (!line.trim()) return; const [st, k, v0] = JSON.parse(line); let v = dec(v0); if (v && v.data instanceof Uint8Array) { v = { ...v, blob: new File([v.data], v.name || "ficheiro", { type: v.type || "" }) }; delete v.data; } await DB.put(st, k, v); n++; if (n % 20 === 0) { $("#busyMsg").textContent = `${nf(n)} itens`; } };
      for (;;) { const { value, done } = await reader.read(); if (done) break; buf += value; let i; while ((i = buf.indexOf("\n")) >= 0) { await putLine(buf.slice(0, i)); buf = buf.slice(i + 1); } }
      await putLine(buf);
      hideBusy(); try { sessionStorage.clear(); } catch {} toast("Cópia restaurada. Entre novamente."); setTimeout(() => location.reload(), 1200);
    } catch (e) { hideBusy(); toast("Não foi possível restaurar: " + e.message, true); }
  };
  $("#bz", el).onclick = () => modal("Apagar todos os dados", `<div class="note n-red mb">Isto apaga utilizadores, semanas, ocorrências, comentários e ficheiros guardados neste computador. Não pode ser desfeito.</div><label class="lbl">Escreva ELIMINAR</label><input class="inp" id="zz">`, [{ label: "Cancelar" }, { label: "Apagar tudo", cls: "red", fn: async (ov) => { if ($("#zz", ov).value.trim().toUpperCase() !== "ELIMINAR") throw new Error("Escreva ELIMINAR."); for (const st of STORES) await DB.clear(st); try { sessionStorage.clear(); } catch {} location.reload(); } }]);
};

      <div class="cl-col"><h3 class="cl-h3">A minha qualidade por semana</h3><p class="cl-h3s">% dos meus registos sem erro</p>${CL.line(hist.map((h) => h.label), hist.map((h) => h.q), { pct: true, meta: G.quality, color: C_GOOD, h: 170, w: 420 })}</div>
      <div class="cl-col"><h3 class="cl-h3">As minhas ações</h3><p class="cl-h3s">Plano de ação atribuído a mim (${myActions.length})</p>
        ${myActions.length ? `<ul class="cl-alerts">${myActions.slice(0, 6).map((x) => `<li><span class="cl-lv ${x.priority === "Alta" ? "red" : "amber"}">${esc(x.priority || "Média")}</span><div><b>${esc(x.title)}</b><div class="d">Prazo ${x.due ? fd(dayFromIso(x.due)) : "—"} · ${ACT_ST[x.status][0]}</div></div></li>`).join("")}</ul>${userPages().includes("plano") ? `<a class="cl-btn noprint" style="display:inline-block;margin-top:10px" href="#/plano">Ver plano de ação</a>` : ""}` : `<div class="cl-empty">Sem ações atribuídas.</div>`}</div></div>
    ${CL.sec(3, "As minhas ocorrências", "por defeito, só as que estão por tratar")}
    <div id="ex"></div>
    ${CL.foot("Clique em «Tratar» para corrigir, comentar ou justificar cada ocorrência.")}
  </div>`;
  CL.wire(el);
  issuesExplorer($("#ex", el), new URLSearchParams(p.get("status") ? p : "status=abertas"), { title: "As minhas ocorrências", allow: a, file: "minhas_ocorrencias", sub: "Por defeito mostra só as que estão por tratar." });
};
</script>

</body>
</html>
